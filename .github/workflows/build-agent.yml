name: Build Windows App and Agent (.exe)

on:
  push:
    branches: [main]
    paths:
      - 'services/agent/**'
      - 'apps/web/**'
      - 'apps/desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write  # Required to create/update releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web and desktop dependencies
        run: npm ci

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/agent/requirements.txt
          pip install pyinstaller

      - name: Build AcademiaShield.exe
        working-directory: services/agent
        run: |
          pyinstaller ^
            --onefile ^
            --console ^
            --name "AcademiaShield" ^
            --add-data ".env.production;." ^
            --hidden-import comms ^
            --hidden-import comms.http_client ^
            --hidden-import comms.socket_client ^
            --hidden-import credentials ^
            --hidden-import enroll ^
            --hidden-import keyring.backends.Windows ^
            --hidden-import enforcement.apps ^
            --hidden-import enforcement ^
            --hidden-import enforcement.hosts ^
            --hidden-import enforcement.dns ^
            --hidden-import enforcement.base ^
            --hidden-import config ^
            --hidden-import env_loader ^
            --hidden-import logger ^
            --hidden-import socketio ^
            --hidden-import activity ^
            --hidden-import activity.base ^
            --hidden-import activity.windows ^
            agent.py
        shell: cmd

      - name: Verify build output
        run: |
          if (Test-Path "services/agent/dist/AcademiaShield.exe") {
            $size = (Get-Item "services/agent/dist/AcademiaShield.exe").Length / 1MB
            Write-Host "✅ Build successful! Size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Error "❌ Build failed — AcademiaShield.exe not found"
            exit 1
          }

      - name: Build bundled web interface
        run: npm run build:web
        env:
          VITE_API_URL: https://academia-shield.onrender.com

      - name: Build Windows desktop installer
        run: npm run build:desktop

      - name: Verify desktop installer
        run: |
          if (-not (Test-Path "apps/desktop/release/AcademiaShieldSetup.exe")) {
            Write-Error "AcademiaShieldSetup.exe was not produced"
            exit 1
          }

      # A successful build alone does not make an executable safe to distribute.
      # Keep CI builds available for verification, but publish only when BOTH
      # the bundled agent and the installer have trusted Authenticode signatures.
      - name: Check release signatures
        id: signatures
        shell: pwsh
        run: |
          $paths = @(
            'services/agent/dist/AcademiaShield.exe',
            'apps/desktop/release/AcademiaShieldSetup.exe'
          )
          $valid = $true
          foreach ($path in $paths) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne 'Valid') {
              Write-Warning "$path has no trusted Authenticode signature; Windows release will not be published."
              $valid = $false
            }
          }
          "publish=$($valid.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Create/Update Nightly Release
        if: steps.signatures.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "🛡️ AcademiaShield Agent (Nightly)"
          body: |
            ## Automated Build

            **Commit:** `${{ github.sha }}`
            **Built at:** ${{ github.event.head_commit.timestamp }}

            ### Download
            Download `AcademiaShieldSetup.exe` below and run it from an administrator-capable Windows account. The setup installs the desktop interface and local agent. The API and database remain online services.

            The standalone agent is also available for existing installations. To install it separately in an **Administrator** terminal:
            ```
            AcademiaShield.exe --install
            ```
            Sign in as a student, generate a one-time enrollment code on the student sessions page, then enter it locally:
            ```
            AcademiaShield.exe enroll
            AcademiaShield.exe
            ```

            ### One-Line Download (PowerShell)
            ```powershell
            Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/releases/download/nightly/AcademiaShield.exe" -OutFile "AcademiaShield.exe"
            ```
          prerelease: true
          make_latest: true
          files: |
            services/agent/dist/AcademiaShield.exe
            apps/desktop/release/AcademiaShieldSetup.exe
