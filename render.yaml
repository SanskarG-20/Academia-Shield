services:
  - type: web
    name: academia-shield-api
    plan: free
    env: node
    buildCommand: npm install && npm run build:api
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Comma-separated email domains allowed to self-register as faculty.
      # Empty disables professor self-registration.
      - key: ALLOWED_PROFESSOR_DOMAINS
        sync: false
    healthCheckPath: /
